name: Desktop runtime smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]" pytest
      - name: Run Qt runtime smoke tests
        run: python -m pytest -q tests/test_settings_qt_smoke.py tests/test_desktop_runtime.py
